apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    run: expressapiapp
  name: expressapiapp
spec:
  replicas: 2
  selector:
    matchLabels:
      run: expressapiapp
  template:
    metadata:
      labels:
        run: expressapiapp
    spec:
      containers:
      - image: myimage
        name: expressapiapp
        ports:
        - containerPort: 3000

---

apiVersion: v1
kind: Service
metadata:
  name: expressapiapp
spec:
  selector:
     run: expressapiapp
  ports:
  - protocol: TCP
    port: 3000
    targetPort: 3000
  type: LoadBalancer